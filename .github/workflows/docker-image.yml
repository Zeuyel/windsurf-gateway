name: Docker Image

on:
  push:
    tags:
      - 'docker-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      DOCKER_PLATFORMS: ${{ vars.DOCKER_PLATFORMS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker publishing config
        run: |
          set -eu
          if [ -z "${DOCKER_REGISTRY}" ]; then
            echo "Repository variable DOCKER_REGISTRY is required." >&2
            exit 1
          fi
          if [ -z "${DOCKER_IMAGE_NAME}" ]; then
            echo "Repository variable DOCKER_IMAGE_NAME is required." >&2
            exit 1
          fi
          if [ -z "${DOCKER_PLATFORMS}" ]; then
            echo "DOCKER_PLATFORMS=linux/amd64,linux/arm64" >> "$GITHUB_ENV"
          else
            echo "DOCKER_PLATFORMS=${DOCKER_PLATFORMS}" >> "$GITHUB_ENV"
          fi
          echo "IMAGE_REF=${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REF }}
          tags: |
            type=raw,value=latest
            type=match,pattern=docker-v(.*),group=1
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
