name: Patcher Release

on:
  push:
    tags:
      - 'patcher-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build patcher
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          mkdir -p dist/bin dist/pkg
          bin_name="windsurf-patcher"
          if [ "${GOOS}" = "windows" ]; then
            bin_name="${bin_name}.exe"
          fi
          out_path="dist/bin/${bin_name}"
          go build -trimpath -ldflags "-s -w" -o "${out_path}" ./cmd/windsurf-patcher
          pkg_base="windsurf-patcher_${GOOS}_${GOARCH}"
          if [ "${{ matrix.archive }}" = "exe" ]; then
            cp "${out_path}" "dist/pkg/${pkg_base}.exe"
          else
            tar -C dist/bin -czf "dist/pkg/${pkg_base}.tar.gz" "${bin_name}"
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: patcher-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/pkg/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/pkg
          merge-multiple: true

      - name: Create checksums
        run: |
          set -eu
          cd dist/pkg
          sha256sum * > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pkg/*
          generate_release_notes: true
